<!doctype html>
<html>
    <head>
        {% if title %}
        <title>{{ title }}</title>
        {% else %}
        <title>Running Database</title>
        {% endif %}
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        <header>
            <h1>Running Database</h1>
            <nav>
                <a href="{{ url_for('index') }}">Home</a>
                <a href="{{ url_for('about') }}">About</a>
                <a href="{{ url_for('programs') }}">Programs</a>
                <a href="{{ url_for('shop') }}">Shop</a>
            </nav>
        </header>
        <div class="container">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                <ul class="flash">{% for msg in messages %}
                        <li>{{ msg }}</li>
                    {% endfor %}
                </ul>
                {% endif %}
            {% endwith %}

            {% block content %} {% endblock %}
        </div>
    </body>
</html>
